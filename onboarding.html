<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    height: 60px;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1.5px solid #A8C7E8;
    background: #EEF6FF;
    color: #315A85;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  a:hover {
    background: #E1EFFF;
    border-color: #8FB5DC;
  }

  .icon {
    font-size: 16px;
  }
</style>
</head>

<body>

  <a href="https://app.notion.com/p/6a08c05738a783cfb41a81d4adea63bc?v=0508c05738a782fb9fa5888a9463a78a&source=copy_link" target="_blank">
    <span class="icon">🗂️</span>
    Onboarding
  </a>

</body>
</html>
