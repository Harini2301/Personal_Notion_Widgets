<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    height: 60px;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  a, button.link-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1.5px solid #b8b4e8;
    background: #f0eff9;
    color: #4a4580;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    font-family: inherit;
  }

  a:hover, button.link-btn:hover {
    background: #e4e2f5;
    border-color: #9d99d8;
  }

  .icon {
    font-size: 16px;
  }

  /* ---- Modal ---- */
  #modalOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 999999;
    align-items: center;
    justify-content: center;
  }

  #modalOverlay.open {
    display: flex;
  }

  #modalBox {
    position: relative;
    width: 92%;
    height: 90%;
    max-width: 1100px;
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
  }

  #modalHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid #eee;
    background: #faf9ff;
  }

  #modalHeader span {
    font-size: 13px;
    color: #4a4580;
    font-weight: 600;
  }

  #closeModal {
    border: none;
    background: #eee;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
  }

  #closeModal:hover {
    background: #ddd;
  }

  #modalFrame {
    flex: 1;
    width: 100%;
    border: none;
  }

  #modalLoading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 13px;
    color: #888;
  }
</style>
</head>

<body>

  <button class="link-btn" id="contactBtn">
    <span class="icon">📥</span>
    Contact Intake
  </button>

  <!-- Modal -->
  <div id="modalOverlay">
    <div id="modalBox">
      <div id="modalHeader">
        <span>Contact Intake</span>
        <button id="closeModal">✕</button>
      </div>
      <div style="position:relative; flex:1;">
        <div id="modalLoading">Loading…</div>
        <iframe id="modalFrame" src="about:blank"></iframe>
      </div>
    </div>
  </div>

  <script>
    const NOTION_URL = "https://app.notion.com/p/5478c05738a783228ea901939f9b1b23?v=1388c05738a782798a67885f1c98feec&source=copy_link";

    const btn = document.getElementById('contactBtn');
    const overlay = document.getElementById('modalOverlay');
    const frame = document.getElementById('modalFrame');
    const closeBtn = document.getElementById('closeModal');
    const loadingText = document.getElementById('modalLoading');

    let loadTimeout;
    let didLoad = false;

    function openModal() {
      didLoad = false;
      loadingText.style.display = 'block';
      overlay.classList.add('open');
      frame.src = NOTION_URL;

      // If the iframe hasn't confirmed load in 2.5s, assume it's blocked
      // (e.g. Notion's X-Frame-Options/CSP refusing to embed) and fall back
      // to opening in a new tab instead of showing a blank modal.
      loadTimeout = setTimeout(() => {
        if (!didLoad) {
          closeModalFn();
          window.open(NOTION_URL, '_blank', 'noopener,noreferrer');
        }
      }, 2500);
    }

    function closeModalFn() {
      overlay.classList.remove('open');
      frame.src = 'about:blank';
      clearTimeout(loadTimeout);
    }

    frame.addEventListener('load', () => {
      // "about:blank" also fires 'load', so ignore the very first blank load
      if (frame.src !== 'about:blank') {
        didLoad = true;
        loadingText.style.display = 'none';
      }
    });

    btn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModalFn);

    // Close modal if user clicks the dark overlay (outside the box)
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeModalFn();
    });

    // Close on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overlay.classList.contains('open')) closeModalFn();
    });
  </script>

</body>
</html>
