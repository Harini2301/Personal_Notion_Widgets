<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    height: 60px;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1.5px solid #E2B1C1;
    background: #FFF1F5;
    color: #82445A;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  a:hover {
    background: #FFE5ED;
    border-color: #D497AB;
  }

  .icon {
    font-size: 16px;
  }
</style>
</head>

<body>

  <a href="https://app.notion.com/p/4338c05738a782bd87098102a4743320?v=3d58c05738a780248369000cc3584117&source=copy_link" target="_blank"> 
    <span class="icon">📄</span> 
    Worksheet 
  </a> 
 
</body> 
</html>
